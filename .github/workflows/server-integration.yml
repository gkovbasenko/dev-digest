# Server integration suite — the 12 DB-backed test files (`*.it.test.ts`).
#
# Each spins up a real Postgres (pgvector) via testcontainers, builds the
# Fastify app, migrates + seeds, and exercises the routes end-to-end against
# the DB. Docker is present on ubuntu-latest, so testcontainers can pull the
# image; the tests also self-skip (`dockerAvailable()`) if Docker is somehow
# absent, so this job degrades to a no-op rather than a hard failure.
#
# Linux only — testcontainers needs a Linux Docker daemon (Windows runners
# don't provide one).
#
# agent-runner/** is in the path filter because src/modules/ci/ci.it.test.ts
# exercises a real export: CiService reads agent-runner's ncc-built
# dist/index.js (gitignored, built fresh in this job — see the build step).
name: server integration

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'agent-runner/**'
      - '.github/workflows/server-integration.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'agent-runner/**'
      - '.github/workflows/server-integration.yml'

permissions:
  contents: read

concurrency:
  group: server-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: tests (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Integration tests load server src, which imports @devdigest/reviewer-core
      # (../reviewer-core/src) → which imports `openai`/`zod`. Install reviewer-core's
      # deps so those resolve at module load. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      # ci.it.test.ts's export tests read agent-runner's ncc-built bundle
      # (`.devdigest/runner/index.js` in the exported PR) via readRunnerBundle().
      # dist/ is gitignored, so it must be built fresh in every CI run.
      #
      # `pnpm approve-builds --all` is required before `pnpm build`: pnpm's
      # isolated node_modules linker (agent-runner has no .npmrc overriding it,
      # unlike server/client's node-linker=hoisted) blocks any dependency's
      # postinstall script — here, esbuild's (a transitive dep of vitest) — until
      # explicitly approved, and `pnpm run build` hard-fails via pnpm's
      # pre-script deps-status-check while it's pending. The approval is a
      # per-machine pnpm state, not something `--frozen-lockfile` or
      # package.json can carry, so it must be re-run on every fresh CI runner.
      # esbuild's postinstall only downloads its own platform binary — a
      # standard, safe operation.
      - name: Build agent-runner bundle
        working-directory: agent-runner
        run: |
          pnpm install --frozen-lockfile
          pnpm approve-builds --all
          pnpm build

      # Inlined rather than `pnpm test:integration`: server/package.json is
      # skip-worktree, so we don't rely on the committed file carrying the split
      # script. The `.it.test` filter selects exactly the 12 DB-backed files.
      # vitest's config gives these a 120s timeout for container spin-up; no API
      # keys needed — LLM/git are mocked.
      - run: pnpm exec vitest run .it.test
